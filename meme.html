<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GTA 6 meme — waited 13 years</title>
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; background: #2b0a4a; }
  svg { display: block; width: 1080px; height: 1080px; }
  .cap { font-family: "Arial Black", Arial, sans-serif; font-weight: 900; fill: #ffffff; stroke: #000000; stroke-width: 10; paint-order: stroke; text-anchor: middle; }
  .neon { font-family: "Arial Black", Arial, sans-serif; font-weight: 900; fill: #ff2e88; text-anchor: middle; }
</style>
</head>
<body>
<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0a4a"/>
      <stop offset="0.45" stop-color="#7b1e6b"/>
      <stop offset="0.72" stop-color="#ff5e78"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="0.35" stop-color="#c94b7c"/>
      <stop offset="1" stop-color="#3b1a5e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9a5c"/>
    </radialGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="0.5" stop-color="#fff3a0"/>
      <stop offset="1" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1080" height="1080" fill="url(#sky)"/>
  <!-- sun: big halo behind the ghost -->
  <circle cx="540" cy="540" r="270" fill="url(#sun)"/>
  <!-- clouds -->
  <ellipse cx="180" cy="180" rx="120" ry="26" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="900" cy="120" rx="140" ry="24" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="830" cy="240" rx="90" ry="20" fill="#ffffff" opacity="0.18"/>
  <!-- sea -->
  <rect x="0" y="660" width="1080" height="200" fill="url(#sea)"/>
  <rect x="120" y="700" width="260" height="8" fill="#ffffff" opacity="0.35"/>
  <rect x="700" y="740" width="300" height="8" fill="#ffffff" opacity="0.3"/>
  <rect x="330" y="790" width="420" height="8" fill="#ffffff" opacity="0.25"/>

  <!-- skyline -->
  <g fill="#1a0b2e">
    <rect x="0" y="800" width="70" height="280"/>
    <rect x="70" y="840" width="90" height="240"/>
    <rect x="160" y="790" width="80" height="290"/>
    <rect x="240" y="850" width="110" height="230"/>
    <rect x="350" y="810" width="70" height="270"/>
    <rect x="660" y="820" width="90" height="260"/>
    <rect x="750" y="780" width="80" height="300"/>
    <rect x="830" y="840" width="100" height="240"/>
    <rect x="930" y="800" width="70" height="280"/>
    <rect x="1000" y="850" width="80" height="230"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffd166" opacity="0.9">
    <rect x="20" y="830" width="14" height="18"/><rect x="45" y="870" width="14" height="18"/>
    <rect x="95" y="870" width="14" height="18"/><rect x="125" y="900" width="14" height="18"/>
    <rect x="180" y="820" width="14" height="18"/><rect x="205" y="860" width="14" height="18"/>
    <rect x="265" y="880" width="14" height="18"/><rect x="305" y="910" width="14" height="18"/>
    <rect x="685" y="850" width="14" height="18"/><rect x="715" y="890" width="14" height="18"/>
    <rect x="775" y="810" width="14" height="18"/><rect x="800" y="850" width="14" height="18"/>
    <rect x="855" y="870" width="14" height="18"/><rect x="895" y="900" width="14" height="18"/>
    <rect x="950" y="830" width="14" height="18"/><rect x="1020" y="880" width="14" height="18"/>
  </g>
  <!-- neon make.fun sign on a rooftop -->
  <rect x="430" y="770" width="220" height="52" rx="8" fill="#12041f" stroke="#ff2e88" stroke-width="4"/>
  <text x="540" y="808" font-size="34" class="neon">make.fun</text>

  <!-- palm trees -->
  <g stroke="#1a0b2e" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M60 860 Q70 720 95 640"/>
    <path d="M95 640 Q60 600 20 610"/>
    <path d="M95 640 Q130 595 170 610"/>
    <path d="M95 640 Q95 590 60 570"/>
    <path d="M95 640 Q110 585 150 575"/>
    <path d="M1020 860 Q1010 720 985 640"/>
    <path d="M985 640 Q1020 600 1060 610"/>
    <path d="M985 640 Q950 595 910 610"/>
    <path d="M985 640 Q985 590 1020 570"/>
    <path d="M985 640 Q970 585 930 575"/>
  </g>

  <!-- TOP CAPTION -->
  <text x="540" y="92" font-size="82" class="cap">WAITED 13 YEARS</text>
  <text x="540" y="178" font-size="82" class="cap">FOR GTA 6</text>

  <!-- THE GHOST (make.fun mascot) -->
  <g transform="translate(540 520)">
    <!-- body -->
    <path d="M0 -290
             C -105 -290 -165 -215 -165 -110
             L -165 210
             L -124 172 L -83 210 L -42 172 L 0 205 L 42 172 L 83 210 L 124 172 L 165 210
             L 165 -110
             C 165 -215 105 -290 0 -290 Z"
          fill="#ffffff" stroke="#000000" stroke-width="12" stroke-linejoin="round"/>
    <!-- sparkle eyes (four-pointed stars) -->
    <path d="M-62 -150 L -52 -120 L -22 -110 L -52 -100 L -62 -70 L -72 -100 L -102 -110 L -72 -120 Z" fill="#000000"/>
    <path d="M62 -150 L 72 -120 L 102 -110 L 72 -100 L 62 -70 L 52 -100 L 22 -110 L 52 -120 Z" fill="#000000"/>
    <!-- smile -->
    <path d="M-28 -58 Q 0 -38 28 -58" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
    <!-- gold chain -->
    <path d="M-95 -40 Q 0 45 95 -40" fill="none" stroke="url(#chain)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="18" r="16" fill="#ffd700" stroke="#000000" stroke-width="5"/>
    <text x="0" y="26" font-size="20" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="#000000">VI</text>
    <!-- left arm + controller -->
    <path d="M-160 -20 Q -215 10 -205 60" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <g transform="translate(-205 62) rotate(-12)">
      <rect x="-52" y="-26" width="104" height="58" rx="16" fill="#2b2b3a" stroke="#000000" stroke-width="6"/>
      <circle cx="-26" cy="0" r="9" fill="#ff2e88"/>
      <circle cx="26" cy="-8" r="6" fill="#ffd166"/>
      <circle cx="26" cy="10" r="6" fill="#7ee0ff"/>
    </g>
    <!-- right arm + magenta star coin -->
    <path d="M160 -20 Q 215 10 205 60" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <g transform="translate(208 78)">
      <circle r="46" fill="#e91e8c" stroke="#000000" stroke-width="7"/>
      <path d="M0 -30 L 8 -10 L 29 -8 L 13 6 L 18 27 L 0 16 L -18 27 L -13 6 L -29 -8 L -8 -10 Z" fill="#ffffff"/>
    </g>
    <!-- little round hand on the coin -->
    <circle cx="196" cy="58" r="18" fill="#ffffff" stroke="#000000" stroke-width="7"/>
  </g>

  <!-- BOTTOM CAPTION -->
  <text x="540" y="950" font-size="74" class="cap">DIED WAITING.</text>
  <text x="540" y="1032" font-size="74" class="cap">STILL PLAYING DAY ONE.</text>
</svg>
</body>
</html>
